
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to Word - PDFCombine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.js"></script>
<style>
body{font-family:Arial;background:#eff6ff;color:#172554;padding:20px;margin:0}
.container{max-width:650px;background:white;margin:40px auto;padding:30px;border-radius:15px;text-align:center;box-shadow:0 5px 20px #0001}
h1{color:#172554}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:12px 0;border-radius:8px}
input{border:1px solid #ccc}
button{background:#2563eb;color:white;border:0;font-size:17px;cursor:pointer}
button:disabled{opacity:.5}
#status{font-weight:bold;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>PDF to Word</h1>
<p>Extract text from your PDF and convert it into an editable Word document.</p>
<input type="file" id="pdfFile" accept="application/pdf">
<button id="convertBtn" onclick="convertPDF()">Convert to Word</button>
<p id="status">Select a PDF file to begin.</p>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function convertPDF(){
 const file=document.getElementById('pdfFile').files[0];
 const status=document.getElementById('status');
 const btn=document.getElementById('convertBtn');

 if(!file){status.textContent='Please select a PDF file.';return;}

 btn.disabled=true;
 status.textContent='Reading PDF... Please wait.';

 try{
  const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await pdfjsLib.getDocument({data}).promise;
  const paragraphs=[];

  for(let i=1;i<=pdf.numPages;i++){
   status.textContent='Converting page '+i+' of '+pdf.numPages+'...';
   const page=await pdf.getPage(i);
   const content=await page.getTextContent();
   let line='';
   let previousY=null;

   for(const item of content.items){
    if(!item.str)continue;
    const y=item.transform[5];
    if(previousY!==null && Math.abs(y-previousY)>4){
     if(line.trim())paragraphs.push(new docx.Paragraph(line.trim()));
     line='';
    }
    line+=item.str+' ';
    previousY=y;
   }
   if(line.trim())paragraphs.push(new docx.Paragraph(line.trim()));
   paragraphs.push(new docx.Paragraph(''));
  }

  if(!paragraphs.length)throw new Error('No selectable text found. Scanned PDFs need OCR.');

  const doc=new docx.Document({
   sections:[{children:paragraphs}]
  });

  const blob=await docx.Packer.toBlob(doc);
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='converted-document.docx';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);

  status.textContent='Success! Your Word document has been downloaded.';

 }catch(error){
  status.textContent='Error: '+error.message;
 }finally{
  btn.disabled=false;
 }
}
</script>
</body>
</html>
