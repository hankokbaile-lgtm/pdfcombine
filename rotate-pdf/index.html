
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotate PDF - PDF Combine Tools</title>
<meta name="description" content="Rotate PDF pages online for free. Rotate PDF files by 90, 180 or 270 degrees.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 20px;
  margin: 0;
  color: #172554;
}

.container {
  max-width: 650px;
  margin: 60px auto;
  background: white;
  padding: 35px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 4px 20px #0001;
}

h1 {
  color: #2563eb;
  font-size: 32px;
}

p {
  color: #64748b;
  line-height: 1.6;
}

.upload-box {
  border: 2px dashed #2563eb;
  background: #eff6ff;
  padding: 30px 15px;
  border-radius: 12px;
  margin: 25px 0;
}

input, select {
  margin: 15px 0;
  padding: 13px;
  width: 100%;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
  margin-top: 15px;
}

button:hover {
  background: #1d4ed8;
}

button:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}

#status {
  margin-top: 20px;
  font-weight: bold;
}

.back {
  display: inline-block;
  margin-top: 25px;
  color: #2563eb;
  text-decoration: none;
}

@media(max-width:600px) {
  .container {
    margin: 20px auto;
    padding: 22px;
  }
  h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Rotate PDF</h1>

<p>Rotate all pages of your PDF document online for free.</p>

<div class="upload-box">

<strong>Select Your PDF File</strong>

<p>Choose a PDF document from your device.</p>

<input type="file" id="pdfFile" accept=".pdf,application/pdf">

</div>

<label for="angle"><strong>Select Rotation Angle</strong></label>

<select id="angle">
<option value="90">Rotate 90° Clockwise</option>
<option value="180">Rotate 180°</option>
<option value="270">Rotate 270° Clockwise</option>
</select>

<button id="rotateBtn">Rotate PDF</button>

<p id="status" aria-live="polite">No file selected.</p>

<a class="back" href="index.html">← Back to PDF Tools</a>

</div>

<script>

const fileInput = document.getElementById("pdfFile");
const rotateBtn = document.getElementById("rotateBtn");
const status = document.getElementById("status");

fileInput.addEventListener("change", () => {
  status.textContent = fileInput.files.length
    ? "PDF selected: " + fileInput.files[0].name
    : "No file selected.";
});

rotateBtn.addEventListener("click", async () => {

  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Please select a PDF file.";
    return;
  }

  if (!file.name.toLowerCase().endsWith(".pdf")) {
    status.textContent = "Please select a valid PDF file.";
    return;
  }

  if (!window.PDFLib) {
    status.textContent = "PDF library failed to load. Refresh and try again.";
    return;
  }

  rotateBtn.disabled = true;
  status.textContent = "Rotating PDF... Please wait.";

  try {

    const { PDFDocument, degrees } = PDFLib;

    const bytes = await file.arrayBuffer();

    const pdf = await PDFDocument.load(bytes);

    const angle = Number(document.getElementById("angle").value);

    pdf.getPages().forEach(page => {
      const current = page.getRotation().angle;
      page.setRotation(degrees((current + angle) % 360));
    });

    const output = await pdf.save();

    const blob = new Blob([output], {
      type: "application/pdf"
    });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "rotated-" + file.name;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);

    status.textContent = "Success! Your PDF has been rotated and downloaded.";

  } catch (error) {

    console.error(error);

    status.textContent = "Rotation failed. Please try another PDF.";

  } finally {

    rotateBtn.disabled = false;

  }

});

</script>

</body>
</html>
